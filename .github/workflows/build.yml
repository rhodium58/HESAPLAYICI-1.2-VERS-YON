name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repoyu Cek
        uses: actions/checkout@v4

      - name: Python 3.12 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python Surumunu Kontrol Et
        run: |
          python --version
          python3 --version
          which python
          which python3

      - name: Java JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sistem Bagimliliklarini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgdbm-dev \
            libncurses5-dev \
            libssl-dev \
            libffi-dev \
            libreadline-dev \
            libsqlite3-dev \
            libbz2-dev \
            ccache \
            zip \
            unzip \
            pkg-config

      - name: Build Araclarini Kur
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install legacy-cgi
          python -m pip install "Cython==0.29.33"
          python -m pip install "buildozer==1.5.0"

      - name: Kurulumlari Kontrol Et
        run: |
          python --version
          python -c "import cgi; print('cgi OK')"
          cython --version
          buildozer --version

      - name: Temiz Build
        run: |
          buildozer android clean

      - name: APK Derle
        run: |
          buildozer android debug

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: CifcilerHesaplayici-APK
          path: bin/*.apk
          if-no-files-found: error
